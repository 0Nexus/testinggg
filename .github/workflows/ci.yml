name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Linter & Type Check
        run: npm run lint

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Test Suite
        env:
          JWT_SECRET: "ci_pipeline_test_jwt_secret_32_characters_long_key"
          NODE_ENV: "test"
        run: npm run test

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-and-integration-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets & Server Bundle
        run: npm run build

      - name: Verify Dist Artifact Output
        run: |
          test -f dist/server.cjs || (echo "Missing dist/server.cjs" && exit 1)
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
